concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare
      - run: pnpm nearley
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: mkdir -p dist && pnpm pack --pack-destination dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
